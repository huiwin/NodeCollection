# ============================================================
# airports.yaml - 机场列表配置
# 来源: jichangnodes 项目 (https://github.com/moneyfly1/jichangnodes)
#
# 字段说明:
#   domain:   机场域名 (不含协议前缀，脚本会自动加 https://)
#   clash:    true 表示该机场已知支持 Clash 格式 (可选)
#   note:     备注 (可选)
#   enabled:  false 表示暂时跳过该机场 (可选，默认 true)
#
# 注意: 此列表仅用于探测公开页面中的订阅链接。
#       不包含自动注册功能 (Phase 2 实现)。
# ============================================================

airports:
  # === 已知支持 Clash 的机场 ===
  - domain: ayucloud.services
    clash: true
  - domain: cyanmori.com
    clash: true
  - domain: lm.laomaoyun.me
    clash: true
    note: 需要优惠券 laomaoyun
  - domain: ziyun.cyou
    clash: true

  # === 常见免费/试用机场 ===
