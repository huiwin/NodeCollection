name: NodeCollection

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'
  watch:
    types: started

permissions:
  contents: write

# P7 (v2.1.0) 优化1: 并发控制, 避免定时任务与手动触发同时运行导致 git push 冲突
concurrency:
  group: nodecollection-fetch
  cancel-in-progress: false  # 不取消正在运行的, 排队等待完成

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Set timezone
      run: sudo timedatectl set-timezone 'Asia/Shanghai'

    - name: Install dependencies
      # P7 (v2.1.0) 优化3: 超时设置
      timeout-minutes: 5
      run: |
        pip install -r ./requirements.txt

    - name: Download and start subconverter
      # P7 (v2.1.0) 优化3: 超时设置
      timeout-minutes: 5
      run: |
        wget -q https://github.com/tindy2013/subconverter/releases/latest/download/subconverter_linux64.tar.gz
        mkdir -p subconverter_bin
        tar xzf subconverter_linux64.tar.gz -C subconverter_bin
        echo "=== subconverter directory contents ==="
        ls -la subconverter_bin/subconverter/
        echo "=== base directory (if exists) ==="
        ls -la subconverter_bin/subconverter/base/ 2>/dev/null || echo "no base dir"
        # subconverter 配置加载:
        # release 包可能包含 pref.example.ini 但不包含 pref.ini,
        # 直接追加 external_config.ini 会创建只有 [custom] section 的不完整配置,
        # 导致缺少 [common] 中的 clash_rule_base, Clash 输出格式异常.
        # 正确做法: 优先从 pref.example.ini 复制完整配置, 再追加自定义 [custom] section.
        SC_DIR=subconverter_bin/subconverter
        if [ -f "$SC_DIR/pref.ini" ]; then
          echo "pref.ini already exists, appending custom config"
        elif [ -f "$SC_DIR/pref.example.ini" ]; then
          echo "pref.ini not found, copying from pref.example.ini"
          cp "$SC_DIR/pref.example.ini" "$SC_DIR/pref.ini"
        else
          echo "WARNING: neither pref.ini nor pref.example.ini found, creating minimal [common] section"
          printf '[common]\nclash_rule_base=base/all_base.tpl\nsurge_rule_base=base/all_base.tpl\n' > "$SC_DIR/pref.ini"
        fi
        cat subconverter/external_config.ini >> "$SC_DIR/pref.ini"
        echo "=== pref.ini sections ==="
        grep "^\[" "$SC_DIR/pref.ini"
        cd "$SC_DIR" && nohup ./subconverter > /dev/null 2>&1 &
        # P7 (v2.1.0) 优化2: 轮询等待 subconverter 启动, 替代不可靠的 sleep 3
        echo "Waiting for subconverter to start..."
        for i in $(seq 1 15); do
          if curl -s http://127.0.0.1:25500/version > /dev/null 2>&1; then
            echo "subconverter started successfully (after ${i}s)"
            curl -s http://127.0.0.1:25500/version
            break
          fi
          sleep 1
        done
        if ! curl -s http://127.0.0.1:25500/version > /dev/null 2>&1; then
          echo "ERROR: subconverter failed to start within 15s"
          exit 1
        fi

    - name: Run collector
      # P7 (v2.1.0) 优化3: 超时设置, 防止采集卡住浪费 Actions 时间
      timeout-minutes: 15
      run: |
        python ./main.py

    - name: Stop subconverter
      if: always()
      run: |
        pkill -f subconverter || true

    - name: Verify output files
      # P7 (v2.1.0) 优化4: commit 前验证关键输出文件存在且非空, 避免提交失败结果
      run: |
        echo "=== Verifying output files ==="
        ERROR=0
        for f in \
          "output/merged/latest.clash.yaml" \
          "output/index.json" \
          "output/status.html" \
          "README.md"; do
          if [ ! -s "$f" ]; then
            echo "❌ MISSING or EMPTY: $f"
            ERROR=1
          else
            SIZE=$(stat -c%s "$f" 2>/dev/null || echo "?")
            echo "✅ OK: $f (${SIZE} bytes)"
          fi
        done
        if [ $ERROR -eq 1 ]; then
          echo "ERROR: Critical output files missing or empty, aborting commit"
          exit 1
        fi

    - name: Commit and Push
      # P7 (v2.1.0) 优化3: 超时设置
      timeout-minutes: 5
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add ./sub ./output ./README.md
        git diff --staged --quiet || git commit -m "Update $(date '+%Y-%m-%d %H:%M:%S')"
        git push origin main

    - name: Deploy to GitHub Pages (T3.5)
      # P7 (v2.1.0) 优化3: 超时设置
      timeout-minutes: 5
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./output
        force_orphan: true
        user_name: 'GitHub Actions'
        user_email: 'actions@github.com'
