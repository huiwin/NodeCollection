name: NodeCollection

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'
  watch:
    types: started

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Set timezone
      run: sudo timedatectl set-timezone 'Asia/Shanghai'

    - name: Install dependencies
      run: |
        pip install -r ./requirements.txt

    - name: Download and start subconverter
      run: |
        wget -q https://github.com/tindy2013/subconverter/releases/latest/download/subconverter_linux64.tar.gz
        mkdir -p subconverter_bin
        tar xzf subconverter_linux64.tar.gz -C subconverter_bin
        cd subconverter_bin/subconverter && nohup ./subconverter > /dev/null 2>&1 &
        sleep 3
        curl -s http://127.0.0.1:25500/version || echo "subconverter start failed"

    - name: Run collector
      run: |
        python ./main.py

    - name: Stop subconverter
      if: always()
      run: |
        pkill -f subconverter || true

    - name: Commit and Push
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add ./sub ./output ./README.md
        git diff --staged --quiet || git commit -m "Update $(date '+%Y-%m-%d %H:%M:%S')"
        git push origin main
