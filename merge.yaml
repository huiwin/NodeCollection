# ============================================================
# 上游订阅融合白名单 (v1.4.0+)
#
# 使用规则:
#   - 仅添加明确公开免费、长期活跃的来源；发现来源性质变化请立即移除
#   - 绝不添加付费机场的订阅链接 (违反服务条款且易被封禁)
#   - name 会作为节点前缀 [ext:name] 展示，请使用简短英文标识
#   - max_nodes 为该来源的节点数上限，0 表示不限制
#   - enabled: false 可临时停用某个来源而不删除配置
#
# 新增来源时需同步在 main.py 的 UPSTREAM_REPO_MAP 中补充仓库地址，
# 用于 README 来源表致谢 (P2 阶段将改为全自动生成)
#
# P11.6 (v2.5.6) 协议过滤说明:
#   融合订阅会过滤 subconverter 无法输出的协议节点
#   (vless/hysteria/hysteria2/hy2/tuic/wireguard/mixed 会被丢弃,
#    仅保留 ss/ssr/vmess/trojan/snell/socks5/http)
#   原因: subconverter 的 Clash 输出模板 (all_base.tpl) 不支持这些新协议,
#   转换时节点会丢失导致实际输出与 index.json 记录不符
# ============================================================

upstreams:
  - name: NoMoreWalls
    url: https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list_raw.txt
    repo: peasoft/NoMoreWalls
    enabled: true
    max_nodes: 80

  - name: FreeNodes
    url: https://raw.githubusercontent.com/Barabama/FreeNodes/feat/ai-crawler-v2/nodes/cfmem.txt
    repo: Barabama/FreeNodes
    enabled: true
    max_nodes: 80

  - name: Pawdroid
    url: https://raw.githubusercontent.com/Pawdroid/Free-servers/main/sub
    repo: Pawdroid/Free-servers
    enabled: true
    max_nodes: 80

  - name: Jsnzkpg
    url: https://sub.445569.xyz/
    repo: Jsnzkpg/Jsnzkpg
    enabled: true
    max_nodes: 80

  # P10 (v2.4.0) 新增
  - name: maflya
    url: https://sub.maflya.com/
    repo: ""
    enabled: true
    max_nodes: 80
