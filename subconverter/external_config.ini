# ============================================================
# subconverter external config
# Referenced by main.py call_subconverter()
# Custom proxy groups, ACL4SSR rules, emoji, node rename
#
# P14 (v2.6.2) 根因修复: 外部 config 必须使用 [custom] section
#   subconverter loadExternalConfig() 仅读取 [custom] section (settings.cpp
#   set_isolated_items_section("custom") + enter_section("custom"))
#   P6/P9.1 误改为 [common] + [rulesets], 导致外部配置从未被加载,
#   地区分组自始未生效。P14 改回 [custom], 全部 key (custom_proxy_group/
#   ruleset/emoji/rename/exclude_remarks/rule_base) 置于 [custom] 内。
#   rule= 一并修正为 emoji= (源码读取 key 为 emoji)。
# ============================================================

[custom]
; ========== 基础配置 (subconverter 必需) ==========
clash_rule_base=base/all_base.tpl
surge_rule_base=base/all_base.tpl

; ========== Emoji ==========
add_emoji=true
remove_old_emoji=true
emoji=(?i)(流量|时间|应急),🏳️
emoji=(?i)(香港|HK|Hong Kong),🇭🇰
emoji=(?i)(台湾|TW|Taiwan),🇹🇼
emoji=(?i)(日本|JP|Japan),🇯🇵
emoji=(?i)(新加坡|SG|Singapore),🇸🇬
emoji=(?i)(美国|US|United States),🇺🇸
emoji=(?i)(韩国|KR|Korea),🇰🇷
emoji=(?i)(英国|UK|United Kingdom|Britain),🇬🇧
emoji=(?i)(德国|DE|Germany),🇩🇪
emoji=(?i)(法国|FR|France),🇫🇷
emoji=(?i)(俄罗斯|RU|Russia),🇷🇺
emoji=(?i)(加拿大|CA|Canada),🇨🇦
emoji=(?i)(澳大利亚|AU|Australia),🇦🇺
emoji=(?i)(荷兰|NL|Netherlands),🇳🇱
emoji=(?i)(印度|IN|India),🇮🇳
emoji=(?i)(巴西|BR|Brazil),🇧🇷
emoji=(?i)(波兰|PL|Poland),🇵🇱

; ========== Node Filter ==========
; P9.2 (v2.3.2): 添加违规词过滤, 屏蔽包含不良内容的节点名称
; 包含: 色情/成人/高清无码/AVToday 等违规关键词
exclude_remarks=(?i)(到期时间|剩余流量|官方网站|产品介绍|平台官网|Expire|Traffic|Website|官网地址|推广链接|广告投放|高清无码|高清無碼|AVToday|成人影片|色情|黃色|黄色网站|情色|萝莉|幼女|强奸|亂倫|乱伦|自慰|性愛|性爱|做爱|炮友|约炮|一夜情|外围|援交|主播福利|福利姬|裸聊|偷拍|偷窥|迷奸|下药)


; ========== Custom Proxy Groups ([custom] section 内) ==========
; format: name`type`filter`test_url`interval


; --- Ruleset target groups (P16.1 修复: 补全规则引用的代理组, 避免 Clash "proxy not found") ---
; ruleset= 引用的组名 (广告拦截/全球直连/国外加速/漏网之鱼)
; 必须在 custom_proxy_group 中定义同名组, 否则生成的 Clash 配置 rules 引用缺失组导致校验失败
custom_proxy_group=🛑 广告拦截`select`[]REJECT
custom_proxy_group=🎯 全球直连`select`[]DIRECT
custom_proxy_group=🚀 国外加速`select`[]♻️ 自动选择`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]♻️ 自动选择`[]DIRECT

; --- Main select ---
custom_proxy_group=🎯 地区选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🇰🇷 韩国节点`[]🇬🇧 英国节点`[]🇩🇪 德国节点`[]🇫🇷 法国节点`[]🇷🇺 俄罗斯节点`[]🇨🇦 加拿大节点`[]DIRECT

; --- Auto test by region ---
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇭🇰 香港节点`url-test`(香港|HK|Hong Kong|🇭🇰|\[HK\])`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇹🇼 台湾节点`url-test`(台湾|TW|Taiwan|🇹🇼|\[TW\])`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇯🇵 日本节点`url-test`(日本|JP|Japan|🇯🇵|\[JP\])`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇸🇬 新加坡节点`url-test`(新加坡|SG|Singapore|🇸🇬|\[SG\])`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇺🇸 美国节点`url-test`(美国|US|United States|America|🇺🇸|\[US\])`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇰🇷 韩国节点`url-test`(韩国|KR|Korea|🇰🇷|\[KR\])`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇬🇧 英国节点`url-test`(英国|UK|United Kingdom|Britain|🇬🇧|\[UK\])`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇩🇪 德国节点`url-test`(德国|DE|Germany|🇩🇪|\[DE\])`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇫🇷 法国节点`url-test`(法国|FR|France|🇫🇷|\[FR\])`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇷🇺 俄罗斯节点`url-test`(俄罗斯|RU|Russia|🇷🇺|\[RU\])`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇨🇦 加拿大节点`url-test`(加拿大|CA|Canada|🇨🇦|\[CA\])`http://www.gstatic.com/generate_204`300,5,50

; --- Fallback ---

; --- Load balance ---

; ========== Rules (ACL4SSR) ==========
enable_rule_generator=true
overwrite_original_rules=true

; --- Ad block ---
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list

; --- Privacy ---

; --- Direct ---
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,[]GEOIP,CN

; --- Proxy ---
ruleset=🚀 国外加速,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list

; --- Telegram ---
ruleset=🚀 国外加速,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list

; --- Apple ---
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list

; --- Microsoft ---
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list

; --- Google ---
ruleset=🚀 国外加速,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Google.list

; --- Streaming ---
ruleset=🚀 国外加速,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaMedia.list

; --- Final ---
ruleset=🐟 漏网之鱼,[]FINAL