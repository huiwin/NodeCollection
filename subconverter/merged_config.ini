# ============================================================
# subconverter external config — merged (融合订阅专用)
# Referenced by main.py generate_merged_format()
# P13 (v2.6.1) 修复: [custom] → [common] + [rulesets]
#   根因: 之前整个文件只有 [custom] section, subconverter 不加载,
#   导致融合订阅地区分组从未生效 (与 P6/P9.1 修复 external_config.ini 同因)
# P12 (v2.6.0): 地区 filter 补充 emoji 匹配, 兼容保留地区+序号的重命名格式 (🇺🇸 01)
# 与 external_config.ini 的区别:
#   1. 地区组覆盖融合订阅常见地区 (含韩国/英国/德国/法国/加拿大等)
#   2. filter 正则兼容 [ext:来源] 前缀
#   3. 规则/ emoji / rename 与主配置保持一致
# ============================================================

[common]
; ========== 基础配置 (subconverter 必需) ==========
clash_rule_base=base/all_base.tpl
surge_rule_base=base/all_base.tpl

; ========== Emoji ==========
add_emoji=true
remove_old_emoji=true
rule=(?i)(流量|时间|应急),🏳️
rule=(?i)(香港|HK|Hong Kong),🇭🇰
rule=(?i)(台湾|TW|Taiwan),🇹🇼
rule=(?i)(日本|JP|Japan),🇯🇵
rule=(?i)(新加坡|SG|Singapore),🇸🇬
rule=(?i)(美国|US|United States),🇺🇸
rule=(?i)(韩国|KR|Korea),🇰🇷
rule=(?i)(英国|UK|United Kingdom|Britain),🇬🇧
rule=(?i)(德国|DE|Germany),🇩🇪
rule=(?i)(法国|FR|France),🇫🇷
rule=(?i)(俄罗斯|RU|Russia),🇷🇺
rule=(?i)(加拿大|CA|Canada),🇨🇦
rule=(?i)(澳大利亚|AU|Australia),🇦🇺
rule=(?i)(荷兰|NL|Netherlands),🇳🇱
rule=(?i)(印度|IN|India),🇮🇳
rule=(?i)(巴西|BR|Brazil),🇧🇷
rule=(?i)(波兰|PL|Poland),🇵🇱

; ========== Node Filter ==========
; 违规词过滤 (与 external_config.ini P9.2 保持一致)
exclude_remarks=(?i)(到期时间|剩余流量|官方网站|产品介绍|平台官网|Expire|Traffic|Website|官网地址|推广链接|广告投放|高清无码|高清無碼|AVToday|成人影片|色情|黃色|黄色网站|情色|萝莉|幼女|强奸|亂倫|乱伦|自慰|性愛|性爱|做爱|炮友|约炮|一夜情|外围|援交|主播福利|福利姬|裸聊|偷拍|偷窥|迷奸|下药)

; ========== Rename ==========
rename=\(?((x|X)?(\d+)(\.?\d+)?)((\s?倍率?:?)|(x|X))?\)?@($1x)

; ========== Custom Proxy Groups (必须在 [common] section) ==========
; format: name`type`filter`test_url`interval

; --- Main select ---
custom_proxy_group=🎯 地区选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🇰🇷 韩国节点`[]🇬🇧 英国节点`[]🇩🇪 德国节点`[]🇫🇷 法国节点`[]🇷🇺 俄罗斯节点`[]🇨🇦 加拿大节点`[]DIRECT

; --- Auto test by region ---
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇭🇰 香港节点`url-test`(香港|HK|Hong Kong|🇭🇰|\[HK\])`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇹🇼 台湾节点`url-test`(台湾|TW|Taiwan|🇹🇼|\[TW\])`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇯🇵 日本节点`url-test`(日本|JP|Japan|🇯🇵|\[JP\])`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇸🇬 新加坡节点`url-test`(新加坡|SG|Singapore|🇸🇬|\[SG\])`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇺🇸 美国节点`url-test`(美国|US|United States|America|🇺🇸|\[US\])`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇰🇷 韩国节点`url-test`(韩国|KR|Korea|🇰🇷|\[KR\])`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇬🇧 英国节点`url-test`(英国|UK|United Kingdom|Britain|🇬🇧|\[UK\])`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇩🇪 德国节点`url-test`(德国|DE|Germany|🇩🇪|\[DE\])`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇫🇷 法国节点`url-test`(法国|FR|France|🇫🇷|\[FR\])`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇷🇺 俄罗斯节点`url-test`(俄罗斯|RU|Russia|🇷🇺|\[RU\])`http://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇨🇦 加拿大节点`url-test`(加拿大|CA|Canada|🇨🇦|\[CA\])`http://www.gstatic.com/generate_204`300,5,50

; --- Fallback ---
custom_proxy_group=🔗 故障转移`fallback`.*`http://www.gstatic.com/generate_204`300,5

; --- Load balance ---
custom_proxy_group=⚖️ 负载均衡`load-balance`.*`http://www.gstatic.com/generate_204`300,,50

[rulesets]
; ========== Rules (ACL4SSR) ==========
enable_rule_generator=true
overwrite_original_rules=true

; --- Ad block ---
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyList.list

; --- Privacy ---
ruleset=🛑 隐私防护,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyPrivacy.list

; --- Direct ---
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIp.list

; --- Proxy ---
ruleset=🚀 国外加速,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list

; --- Telegram ---
ruleset=📲 电报消息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list

; --- Apple ---
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list

; --- Microsoft ---
ruleset=🪚 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list

; --- Google ---
ruleset=🌍 谷歌服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Google.list

; --- Streaming ---
ruleset=🎬 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🎬 国内媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaMedia.list

; --- Final ---
ruleset=🐟 漏网之鱼,[]FINAL
